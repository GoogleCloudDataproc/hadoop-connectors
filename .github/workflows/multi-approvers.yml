name: 'multi-approvers'

on:
  # zizmor: ignore[dangerous-triggers] - Required to access MULTI_APPROVERS_TOKEN on fork PRs; no PR code is checked out
  pull_request_target:
    types:
      - 'opened'
      - 'edited'
      - 'reopened'
      - 'synchronize'
      - 'ready_for_review'
      - 'review_requested'
      - 'review_request_removed'
  pull_request_review:
    types:
      - 'submitted'
      - 'dismissed'

# Ensure only one run per PR is active to reduce API consumption
concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

permissions:
  actions: 'write'
  contents: 'read'
  pull-requests: 'read'

jobs:
  multi-approvers:
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Check Two-Party Review Status'
        uses: 'abcxyz/actions/.github/actions/multi-approvers@cd65e574b76ed2293095f5e6331267b9b8202d86' # main
        with:
          token: ${{ secrets.MULTI_APPROVERS_TOKEN }}
          team: 'gcs-connector-team'
